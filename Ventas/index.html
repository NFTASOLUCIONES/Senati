<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Bienvenida</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: #fff;
        }

        .container {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h3 {
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input {
            background: #f9f9f9;
        }

        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="4200_3_03.jpg" alt="Foto del Usuario">
        <h3>Bienvenido, Usuario-47</h3>
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <div id="errorMessage" class="error"></div>
    </div>

    <script>
        // Configuración del usuario
        const user = {
            password: "1234", // Cambia esto por la contraseña real
            redirectUrl: "Ventasadministrador.html" // Cambia esto por la URL de redirección
        };

        // Validar la contraseña y redirigir
        function login() {
            const inputPassword = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");

            if (inputPassword === user.password) {
                // Redirigir a la URL correspondiente
                window.location.href = user.redirectUrl;
            } else {
                errorMessage.textContent = "Contraseña incorrecta. Inténtalo de nuevo.";
            }
        }
    </script>

</body>
</html>
